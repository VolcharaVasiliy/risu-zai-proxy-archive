<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="none"
                stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="header-text">
        <h1 id="extName">Credentials Exporter</h1>
        <p id="headerSubtitle"></p>
      </div>
      <div class="lang-switch" id="langSwitch" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ru">РУ</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
    </header>

    <section class="stage">
      <button id="scanBtn" class="scan-btn" type="button">
        <span class="scan-btn-label" id="scanBtnLabel">Scan</span>
      </button>
      <div class="stage-row">
        <span id="lastScan" class="last-scan"></span>
        <button id="clearBtn" class="clear-link hidden" type="button"></button>
      </div>
      <div id="hint" class="hint hidden"></div>
      <div id="warn" class="warn hidden"></div>
      <div id="selfCheck" class="self-check hidden"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <span class="block-title" id="providersTitle"></span>
      </div>
      <div class="providers-wrap">
        <div id="providers" class="providers"></div>
      </div>
    </section>

    <div class="panel" id="apiPanel">
      <button id="apiToggle" class="panel-toggle" type="button" aria-expanded="false">
        <span id="apiToggleLabel" class="toggle-label"></span>
        <span class="chevron"></span>
      </button>
      <div id="apiBody" class="panel-body">
        <label id="studioKeyLabel" class="field-label" for="studioKey"></label>
        <input id="studioKey" class="field" type="text" spellcheck="false" autocomplete="off"
               placeholder="AIza..." />
        <label id="studioWebTemplateLabel" class="field-label" for="studioWebTemplate"></label>
        <textarea id="studioWebTemplate" class="field field-area" spellcheck="false" autocomplete="off"></textarea>
        <label id="inflectionKeyLabel" class="field-label" for="inflectionKey"></label>
        <input id="inflectionKey" class="field" type="text" spellcheck="false" autocomplete="off" />
      </div>
    </div>

    <div class="panel" id="jsonPanel">
      <button id="jsonToggle" class="panel-toggle" type="button" aria-expanded="false">
        <span id="jsonToggleLabel" class="toggle-label"></span>
        <span class="chevron"></span>
      </button>
      <div id="jsonBody" class="panel-body">
        <textarea id="jsonOut" class="json-out" readonly spellcheck="false"></textarea>
        <div class="actions">
          <button id="debugBtn" class="btn ghost" type="button"></button>
          <button id="copyBtn" class="btn ghost" type="button"></button>
          <button id="dlBtn" class="btn solid" type="button" disabled></button>
        </div>
      </div>
    </div>

    <footer id="footer" class="footer"></footer>
  </div>

  <script src="i18n-bundle.js"></script>
  <script src="provider-schema.js"></script>
  <script src="popup.js"></script>
</body>
</html>
